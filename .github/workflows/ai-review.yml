name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    name: Claude AI Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD | head -c 40000 > /tmp/pr_diff.txt

      - name: AI Code Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, subprocess

          diff = open('/tmp/pr_diff.txt').read()
          prompt = f"""以下のPR差分をコードレビューしてください。

次の観点で日本語でレビューしてください:
- バグ・潜在的な問題
- セキュリティの懸念
- パフォーマンスの問題
- コードの品質・可読性
- 改善提案

問題がなければ「特に問題はありません」と伝えてください。

```diff
{diff}
```"""

          payload = json.dumps({
            "model": "claude-haiku-4-5-20251001",
            "max_tokens": 2048,
            "messages": [{"role": "user", "content": prompt}]
          }).encode()

          req = urllib.request.Request(
            "https://api.anthropic.com/v1/messages",
            data=payload,
            headers={
              "x-api-key": os.environ["ANTHROPIC_API_KEY"],
              "anthropic-version": "2023-06-01",
              "content-type": "application/json",
            }
          )
          with urllib.request.urlopen(req) as res:
            review = json.loads(res.read())["content"][0]["text"]

          body = f"## AI Code Review\n\n{review}\n\n---\n*Claude Haiku による自動コードレビュー*"

          subprocess.run([
            "gh", "pr", "comment", os.environ["PR_NUMBER"],
            "--body", body
          ], check=True)
          PYEOF
